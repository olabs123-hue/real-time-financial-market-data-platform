services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    command: ["redpanda","start","--overprovisioned","--smp","1","--memory","1G","--reserve-memory","0M","--node-id","0","--check=false","--kafka-addr","PLAINTEXT://0.0.0.0:9092","--advertise-kafka-addr","PLAINTEXT://redpanda:9092"]
    healthcheck:
      test: ["CMD","rpk","cluster","health"]
      interval: 10s
      retries: 15
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market
      POSTGRES_DB: market
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U market"]
      interval: 5s
      retries: 15
    volumes: ["pgdata:/var/lib/postgresql/data"]
  consumer:
    build: ./python
    command: ["python","-m","app.consumer"]
    environment:
      DATABASE_URL: postgresql://market:market@postgres:5432/market
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
    restart: unless-stopped
  api:
    build: ./python
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://market:market@postgres:5432/market
    depends_on:
      postgres: {condition: service_healthy}
      consumer: {condition: service_started}
    restart: unless-stopped
  producer:
    build: ./cpp
    command: ["--count","10000"]
    depends_on:
      redpanda: {condition: service_healthy}
      consumer: {condition: service_started}
volumes:
  pgdata:
